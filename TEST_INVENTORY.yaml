# TEST_INVENTORY.yaml — P1 Naming Authority
# Maps every FR to expected test function names. These are the AUTHORITATIVE names
# that derive_test_cases.md preserves in TEST_SPEC.md (P2 single source of truth).
# Specified per FR and per test category (unit/integration/cross_cutting).
# If no name is specified for a category, derive_test_cases.md fills the gap with
# names derived via the 7-Question Protocol.
format_version: "1.1"

# ── test_inventory ────────────────────────────────────────────────────────
# Round 74 站5. The P1 prompt (scripts/workflowgen/spec_phase1.py) calls this
# key REQUIRED — "Non-conforming schema fails the load step" — and this file,
# which cli/project_cmds.py copies into every new project root on day one, did
# not contain it. Nor did anything say what goes under it. Seven projects
# invented four spellings of the same field (test_function, test_name,
# test_function_name, none at all) and three different container shapes, and
# the rule in cli/checks/specs.py that reads this block could see three of
# nine of them.
#
# `tests:` is the enumerated 1:1 mapping with TRACEABILITY_MATRIX §1 the
# prompt already describes; the summary blocks are the arithmetic it already
# checks. Each entry carries:
#
#   tc_id          the matrix id, one entry per id — never a range
#   fr / nfr       the requirement this test verifies (exactly one of them,
#                  and the whole value is the id — a test that merely touches
#                  another requirement says so in cross_ref_frs/cross_ref_nfrs)
#   layer          unit | static | integration | e2e — what runs it, and the
#                  field the NFR Layering Hard Rule reads
#   test_function  the name, identical to TEST_SPEC.md's `Test Function` cell
#   test_file      where it will live
test_inventory:
  tests:
    - tc_id: TC-FR01-01
      fr: FR-01
      ac: AC-1.1
      layer: integration
      test_function: test_fr01_example_integration
      test_file: tests/integration/test_fr01.py
    - tc_id: TC-FR01-02
      fr: FR-01
      ac: AC-1.2
      layer: unit
      test_function: test_fr01_example_unit
      test_file: tests/unit/test_fr01.py
      cross_ref_nfrs: [NFR-02]
    - tc_id: TC-FR02-01
      fr: FR-02
      ac: AC-2.1
      layer: integration
      test_function: test_fr02_run_task_returns_202_with_run_id
      test_file: tests/integration/test_fr02.py
    - tc_id: TC-FR03-01
      fr: FR-03
      ac: AC-3.1
      layer: integration
      test_function: test_fr03_missing_api_key_returns_401
      test_file: tests/integration/test_fr03.py
    - tc_id: TC-FR04-01
      fr: FR-04
      ac: AC-4.2
      layer: integration
      test_function: test_fr04_insufficient_scope_returns_403
      test_file: tests/integration/test_fr04.py
    - tc_id: TC-FR05-01
      fr: FR-05
      ac: AC-5.2
      layer: integration
      test_function: test_fr05_rate_limit_exceeded_returns_429
      test_file: tests/integration/test_fr05.py
    - tc_id: TC-FR06-01
      fr: FR-06
      ac: AC-6.2
      layer: integration
      test_function: test_fr06_session_commits_on_success_rolls_back_on_exception
      test_file: tests/integration/test_fr06.py
    - tc_id: TC-FR07-01
      fr: FR-07
      ac: AC-7.3
      layer: integration
      test_function: test_fr07_migration_round_trip_preserves_data
      test_file: tests/integration/test_fr07.py
    - tc_id: TC-FR08-01
      fr: FR-08
      ac: AC-8.1
      layer: integration
      test_function: test_fr08_graceful_drain_waits_for_inflight_tasks
      test_file: tests/integration/test_fr08.py
    - tc_id: TC-FR09-01
      fr: FR-09
      ac: AC-9.2
      layer: integration
      test_function: test_fr09_readyz_returns_503_when_db_down
      test_file: tests/integration/test_fr09.py
    - tc_id: TC-FR10-01
      fr: FR-10
      ac: AC-10.1
      layer: integration
      test_function: test_fr10_error_response_is_problem_json
      test_file: tests/integration/test_fr10.py
    # An NFR whose verifier is a unit or static check belongs here with its
    # layer, and in TEST_SPEC.md's "Deferred to Downstream Phases" section.
    - tc_id: TC-N02-01
      nfr: NFR-02
      ac: AC-N2.1
      layer: static
      test_function: test_security_example
      test_file: tests/static/test_nfr02.py
    - tc_id: TC-N09-01
      nfr: NFR-09
      ac: AC-N9.1
      layer: integration
      test_function: test_deployment_example
      test_file: tests/integration/test_nfr09.py
  coverage_summary:
    total_test_cases: 13
    by_fr:
      FR-01: {tc_count: 2}
      FR-02: {tc_count: 1}
      FR-03: {tc_count: 1}
      FR-04: {tc_count: 1}
      FR-05: {tc_count: 1}
      FR-06: {tc_count: 1}
      FR-07: {tc_count: 1}
      FR-08: {tc_count: 1}
      FR-09: {tc_count: 1}
      FR-10: {tc_count: 1}
      NFR-02: {tc_count: 1}
      NFR-09: {tc_count: 1}
    by_layer:
      integration: {count: 11}
      unit: {count: 1}
      static: {count: 1}

# ── fr_tests / cross_cutting ──────────────────────────────────────────────
# The name-only view, read by spec_coverage._flatten_test_names (P1 Naming
# Authority) and required by the P1→P2 handoff validator. Every name here
# must also appear as a `tests:` entry above; these lists carry no layer, so
# they cannot answer which NFR tests are unit or static.
fr_tests:
  FR-01:
    unit:
      - test_fr01_example_unit
    integration:
      - test_fr01_example_integration
  FR-02:
    integration:
